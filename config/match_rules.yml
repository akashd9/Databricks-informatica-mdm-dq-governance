entity: customer
id_column: customer_id

blocking_keys:
  - [country_code, postal_code_prefix]
  - [email_domain, last_name_soundex]

match_attributes:
  - column: full_name
    method: jaro_winkler
    weight: 0.35
  - column: email
    method: exact
    weight: 0.25
  - column: tax_id
    method: exact
    weight: 0.25
  - column: address_line1
    method: jaro_winkler
    weight: 0.15

# Tuned against pilot/generate_pilot_dataset.py via pilot/run_pilot_validation.py
# (see pilot/PILOT_REPORT.md): 0.82 under-matched badly (recall 0.60) despite
# perfect precision at every threshold tested down to 0.45, meaning this
# pilot's data had no near-miss false-positive risk in that range. Picked
# 0.65 for margin below the empirical break-even (0.70 already hit recall
# 0.975; 0.65-0.45 all plateaued at precision=1.0/recall=1.0). Re-tune this
# once real source data is available — synthetic data's error patterns won't
# exactly match production's.
match_threshold: 0.65
# Matches at/above this are merged with no flag; matches between
# match_threshold and this are still merged (best current guess) but marked
# needs_review in survivorship.py's output for steward follow-up.
auto_merge_threshold: 0.93

survivorship:
  strategy: source_priority_then_recency
  source_priority: [erp, crm, partner_api, flatfile]

# Governs the call-out to Informatica MDM SaaS batch match/merge API. When
# disabled, the local union-find-based fallback in match_merge.py runs
# instead, using the attributes/threshold above.
informatica_mdm:
  enabled: false # flip to true once MDM connectivity/secrets are configured
  business_entity: Customer
  match_rule_set: CUST_MATCH_RULESET_V1
