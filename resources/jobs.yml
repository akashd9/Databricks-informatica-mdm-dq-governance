resources:
  jobs:
    mdm_dq_medallion_job:
      name: mdm-dq-medallion-orchestration-${bundle.target}
      # Each task is a gate: a failure here halts the run instead of letting
      # ungoverned or unmonitored data reach downstream consumers.
      tasks:
        - task_key: freshness_gate
          notebook_task:
            notebook_path: ../src/observability/freshness_checks.py

        - task_key: run_medallion_pipeline
          depends_on:
            - task_key: freshness_gate
          pipeline_task:
            pipeline_id: ${resources.pipelines.mdm_dq_medallion_pipeline.id}

        - task_key: anomaly_gate
          depends_on:
            - task_key: run_medallion_pipeline
          notebook_task:
            notebook_path: ../src/observability/anomaly_gate.py
          # Task-level, in addition to the job-level on_failure below — a DQ/
          # volume regression is a governance-team problem, not necessarily
          # the same on-call rotation as a generic infra/pipeline failure.
          email_notifications:
            on_failure: ${var.governance_alert_emails}

        - task_key: refresh_steward_queue
          depends_on:
            - task_key: run_medallion_pipeline
          notebook_task:
            notebook_path: ../src/governance/steward_review_refresh.py

        - task_key: apply_glossary_submissions
          depends_on:
            - task_key: run_medallion_pipeline
          notebook_task:
            notebook_path: ../src/governance/glossary_submissions_apply.py

        - task_key: glossary_lineage_gate
          depends_on:
            - task_key: anomaly_gate
            - task_key: refresh_steward_queue
            - task_key: apply_glossary_submissions
          notebook_task:
            notebook_path: ../src/governance/glossary_gate.py
          email_notifications:
            on_failure: ${var.governance_alert_emails}

        - task_key: cost_monitor
          depends_on:
            - task_key: run_medallion_pipeline
          notebook_task:
            notebook_path: ../src/observability/cost_monitor.py

        - task_key: refresh_drift_monitor
          depends_on:
            - task_key: glossary_lineage_gate
            - task_key: cost_monitor
          notebook_task:
            notebook_path: ../src/observability/drift_monitor.py

      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: UTC
        pause_status: PAUSED

      email_notifications:
        on_failure: ${var.alert_emails}
      webhook_notifications:
        on_failure: ${var.alert_webhook_destinations}
      # Retried/skipped/canceled runs would otherwise duplicate or pad out
      # the signal a real on-call rotation acts on.
      notification_settings:
        no_alert_for_skipped_runs: true
        no_alert_for_canceled_runs: true

    mdm_dq_medallion_maintenance_job:
      name: mdm-dq-medallion-maintenance-${bundle.target}
      # Separate, low-frequency job: VACUUM is storage cleanup, not part of
      # the hourly data flow, and running it that often would just waste
      # compute. See src/governance/vacuum_maintenance.py for the retention
      # window this enforces.
      tasks:
        - task_key: vacuum_tables
          notebook_task:
            notebook_path: ../src/governance/vacuum_maintenance.py

      schedule:
        quartz_cron_expression: "0 0 3 ? * SUN"
        timezone_id: UTC
        pause_status: PAUSED

      email_notifications:
        on_failure: ${var.alert_emails}
      webhook_notifications:
        on_failure: ${var.alert_webhook_destinations}
      notification_settings:
        no_alert_for_skipped_runs: true
        no_alert_for_canceled_runs: true
