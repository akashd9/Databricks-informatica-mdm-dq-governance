resources:
  pipelines:
    mdm_dq_medallion_pipeline:
      name: mdm-dq-medallion-${bundle.target}
      catalog: ${var.catalog}
      target: silver
      channel: PREVIEW
      photon: true
      continuous: false
      libraries:
        - file:
            path: ../src/bronze/bronze_ingest.py
        # customer
        - file:
            path: ../src/silver/silver_transform.py
        - file:
            path: ../src/quality/dq_gate.py
        - file:
            path: ../src/mdm/match_merge.py
        - file:
            path: ../src/gold/gold_golden_records.py
        # account — same gate pattern, reusing the customer modules'
        # classes/functions; see config/account_*.yml
        - file:
            path: ../src/silver/silver_transform_account.py
        - file:
            path: ../src/quality/dq_gate_account.py
        - file:
            path: ../src/mdm/match_merge_account.py
        - file:
            path: ../src/gold/gold_golden_records_account.py
      configuration:
        pipelines.reset.allowed: "false"
      # This workspace requires serverless compute for pipelines — classic
      # clusters (num_workers, node types) aren't an option here, found via
      # an actual deploy attempt (INVALID_PARAMETER_VALUE: "You must use
      # serverless compute in this workspace").
      serverless: true
      tags:
        project: mdm-dq-medallion
      # jellyfish isn't preinstalled on the serverless environment; needed
      # by LocalDQFallback/LocalMatchMergeFallback's local fallbacks.
      environment:
        dependencies:
          - jellyfish>=1.0
