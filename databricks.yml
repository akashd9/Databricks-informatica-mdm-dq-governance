bundle:
  name: mdm-dq-medallion

variables:
  catalog:
    default: mdm_dq_demo

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-96900e6d-823b.cloud.databricks.com
  test:
    mode: development
    workspace:
      host: https://dbc-96900e6d-823b.cloud.databricks.com
      # own root_path so dev/test/prod deployments never collide even
      # though they currently share a workspace host.
      root_path: /Workspace/Users/akash.dolas@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: mdm_dq_test
  prod:
    mode: production
    workspace:
      host: https://dbc-96900e6d-823b.cloud.databricks.com
      # production mode requires a fixed root_path so at most one copy is
      # ever deployed — a per-developer default path would let two people
      # each deploy their "own" prod by accident.
      root_path: /Workspace/Users/akash.dolas@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: mdm_dq_prod
