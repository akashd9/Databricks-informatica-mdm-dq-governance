bundle:
  name: mdm-dq-medallion

variables:
  catalog:
    default: mdm_dq_demo
  # Job failure emails. Defaults to whoever deployed the bundle so a fresh
  # dev deployment always has *someone* notified; override per environment
  # (see prod's variables below) with a real on-call distribution list —
  # one person's inbox is not an incident process.
  alert_emails:
    type: complex
    default:
      - ${workspace.current_user.userName}
  # Separate list for the DQ/governance gates specifically (anomaly_gate,
  # glossary_lineage_gate) — a data-quality regression and a generic
  # pipeline/infra failure often belong to different on-call rotations.
  # Defaults to the same list as alert_emails; override independently once
  # a real governance distribution list exists.
  governance_alert_emails:
    type: complex
    default:
      - ${workspace.current_user.userName}
  # Databricks notification destinations (Slack/PagerDuty/MS Teams/generic
  # webhook — see terraform/alerting.tf) for job failure alerts beyond
  # email. Empty list by default: an empty webhook_notifications list is
  # valid and just means "no webhook configured", unlike a single entry
  # with a blank id, which would fail at deploy. Terraform and the bundle
  # are separate tools/state here, so this isn't wired automatically —
  # after `terraform apply` creates a destination, override this variable
  # with its id, e.g.
  #   databricks bundle deploy -t prod --var='alert_webhook_destinations=[{"id":"<real-id>"}]'
  alert_webhook_destinations:
    type: complex
    default: []

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-96900e6d-823b.cloud.databricks.com
  test:
    mode: development
    workspace:
      host: https://dbc-96900e6d-823b.cloud.databricks.com
      # own root_path so dev/test/prod deployments never collide even
      # though they currently share a workspace host.
      root_path: /Workspace/Users/akash.dolas@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: mdm_dq_test
  prod:
    mode: production
    workspace:
      host: https://dbc-96900e6d-823b.cloud.databricks.com
      # production mode requires a fixed root_path so at most one copy is
      # ever deployed — a per-developer default path would let two people
      # each deploy their "own" prod by accident.
      root_path: /Workspace/Users/akash.dolas@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: mdm_dq_prod
