name: CI

on:
  push:
    branches: [main, test, prod]
  pull_request:
    branches: [main, test, prod]

jobs:
  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PySpark needs a JVM. GitHub-hosted runners don't have one by
      # default, so the Spark-backed tests (test_dq_rules.py,
      # test_survivorship.py) can't run on a bare dev machine without Java —
      # this is exactly what fills that gap in CI.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v

  terraform-validate:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      # No backend, no credentials needed — this only checks HCL syntax and
      # internal resource-reference consistency, not live infrastructure.
      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  bundle-validate:
    name: databricks bundle validate
    runs-on: ubuntu-latest
    # Needs real workspace credentials (DATABRICKS_HOST / DATABRICKS_TOKEN
    # repo secrets) to resolve against an actual metastore/catalog, so this
    # only runs on pushes to main/test/prod (assumed to have them
    # configured), not on every PR from a fork that wouldn't have access to
    # those secrets.
    if: github.event_name == 'push'
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      # main -> dev target, test branch -> test target, prod branch -> prod
      # target — keeps "which branch validates against which environment"
      # in one place instead of three near-duplicate jobs.
      - name: Determine bundle target for this branch
        id: target
        run: |
          case "${{ github.ref_name }}" in
            prod) echo "target=prod" >> "$GITHUB_OUTPUT" ;;
            test) echo "target=test" >> "$GITHUB_OUTPUT" ;;
            *) echo "target=dev" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: databricks bundle validate
        run: databricks bundle validate -t ${{ steps.target.outputs.target }}
